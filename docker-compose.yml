# Sabz System local development environment.
#
# All values below are safe local-development defaults. Every `${VAR:-default}`
# can be overridden from a root `.env` file (see .env.example):
#   cp .env.example .env
# Values not marked overridable are pinned for this environment.
#
# NOTE: a root `.env` is only read for ${VAR} interpolation here — it is not
# injected into containers by itself; each variable is passed explicitly
# through the `environment:` blocks below.

services:
  postgres:
    image: postgres:16
    container_name: sabz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabz}
      POSTGRES_DB: ${POSTGRES_DB:-sabz}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabz} -d ${POSTGRES_DB:-sabz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sabz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sabz-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Pinned for the local development environment. NODE_ENV also gates the
      # Swagger UI (non-production only) and the `prisma:seed` script.
      NODE_ENV: development
      PORT: 3000
      # Inside the Compose network the API must reach Postgres and Redis by
      # their Compose service names; these hosts are not host-configurable.
      # DATABASE_URL is derived from the POSTGRES_* variables so credentials
      # are defined in one place. If you override POSTGRES_PASSWORD, keep it
      # URL-safe (no @ : / characters) or encode it.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sabz}:${POSTGRES_PASSWORD:-sabz}@postgres:5432/${POSTGRES_DB:-sabz}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The local Compose Redis has no password configured. If you set
      # REDIS_PASSWORD here, the redis service must be configured to require
      # it as well or the API will fail to authenticate.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # JWT secrets: development placeholders only; override from the root
      # `.env` with long random strings outside local development.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      TRUST_PROXY: ${TRUST_PROXY:-}
      DEV_ADMIN_MOBILE: ${DEV_ADMIN_MOBILE:-+989170000001}
      # Business document storage. Pinned directory: the api_documents named
      # volume is mounted at exactly this path, so it must not be overridden
      # independently of that mount. The local driver is the only driver
      # implemented (SS-038); object-storage drivers are future work.
      DOCUMENT_STORAGE_DRIVER: ${DOCUMENT_STORAGE_DRIVER:-local}
      DOCUMENT_STORAGE_DIR: /app/.data/documents
      # Product media storage (SS-105). Pinned directory: the api_product_media
      # named volume is mounted at exactly this path, so it must not be
      # overridden independently of that mount. Only the local driver is
      # implemented; object storage is future work.
      PRODUCT_MEDIA_STORAGE_DRIVER: ${PRODUCT_MEDIA_STORAGE_DRIVER:-local}
      PRODUCT_MEDIA_STORAGE_DIR: /app/.data/product-media
      # Media pipeline (SS-105): temp dir inside the media volume (swept at
      # startup) and per-type size caps (images 10 MB, videos 200 MB). Only
      # PRODUCT_MEDIA_TEMP_DIR is fixed here; size caps keep their code
      # defaults unless overridden from the root .env.
      PRODUCT_MEDIA_TEMP_DIR: ${PRODUCT_MEDIA_TEMP_DIR:-/app/.data/product-media/tmp}
      PRODUCT_MEDIA_IMAGE_MAX_SIZE_BYTES: ${PRODUCT_MEDIA_IMAGE_MAX_SIZE_BYTES:-}
      PRODUCT_MEDIA_VIDEO_MAX_SIZE_BYTES: ${PRODUCT_MEDIA_VIDEO_MAX_SIZE_BYTES:-}
      PRODUCT_DESCRIPTION_IMAGE_MAX_SIZE_BYTES: ${PRODUCT_DESCRIPTION_IMAGE_MAX_SIZE_BYTES:-}
      # Company watermarking (CATALOG-007). FFmpeg is installed in the API
      # image for the video watermark; branding assets are bundled under
      # apps/api/assets/watermark and can be overridden from the root .env.
      WATERMARK_ENABLED: ${WATERMARK_ENABLED:-true}
      WATERMARK_COMPANY_NAME: ${WATERMARK_COMPANY_NAME:-سبز سیستم}
      WATERMARK_LOGO_PATH: ${WATERMARK_LOGO_PATH:-assets/watermark/logo-placeholder.svg}
      WATERMARK_FONT_PATH: ${WATERMARK_FONT_PATH:-assets/watermark/fonts/Vazirmatn-Regular.ttf}
      WATERMARK_OPACITY: ${WATERMARK_OPACITY:-0.55}
      WATERMARK_POSITION: ${WATERMARK_POSITION:-bottom-right}
      WATERMARK_MARGIN_RATIO: ${WATERMARK_MARGIN_RATIO:-0.04}
      WATERMARK_SIZE_RATIO: ${WATERMARK_SIZE_RATIO:-0.3}
      WATERMARK_MIN_SIZE_PX: ${WATERMARK_MIN_SIZE_PX:-140}
      WATERMARK_MAX_SIZE_PX: ${WATERMARK_MAX_SIZE_PX:-360}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
    volumes:
      - ./apps/api:/app/apps/api
      - api_node_modules:/app/apps/api/node_modules
      - api_documents:/app/.data/documents
      - api_product_media:/app/.data/product-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: sabz-admin
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
      # Vite dev-server proxy target for relative /api calls. Inside the
      # Compose network the API is reached by its service name, not localhost.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:3000}
    command: ["pnpm", "--filter", "@sabz/admin", "dev", "--host", "0.0.0.0"]
    volumes:
      - ./apps/admin:/app/apps/admin
      - admin_node_modules:/app/apps/admin/node_modules

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: sabz-storefront
    restart: unless-stopped
    ports:
      - "3002:3001"
    command: ["pnpm", "--filter", "@sabz/storefront", "dev", "--hostname", "0.0.0.0"]
    volumes:
      - ./apps/storefront:/app/apps/storefront
      - storefront_node_modules:/app/apps/storefront/node_modules

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  admin_node_modules:
  storefront_node_modules:
  # Persistent local development storage for business documents. Mounted at
  # /app/.data/documents in the API container (see DOCUMENT_STORAGE_DIR).
  api_documents:
  # Persistent local development storage for product media. Mounted at
  # /app/.data/product-media in the API container (see PRODUCT_MEDIA_STORAGE_DIR).
  api_product_media:
