services:
  postgres:
    image: postgres:16
    container_name: sabz-postgres
    environment:
      POSTGRES_USER: sabz
      POSTGRES_PASSWORD: sabz
      POSTGRES_DB: sabz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabz -d sabz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
